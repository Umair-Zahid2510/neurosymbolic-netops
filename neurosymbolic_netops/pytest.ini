[pytest]
testpaths = tests
markers =
    live: calls a real LLM provider (needs API key; costs money)
    batfish: needs a running Batfish service on localhost:9996
    emulator: needs the FRR Docker testbed
    slow: takes more than a few seconds
addopts = -q -m "not live and not batfish and not emulator"
filterwarnings =
    ignore::DeprecationWarning
