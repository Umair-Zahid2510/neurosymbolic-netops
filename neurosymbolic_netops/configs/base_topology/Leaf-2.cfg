! Leaf-2 Configuration
hostname Leaf-2
!
ip routing
!
ip access-list extended PERIMETER_SECURITY_POLICY
 deny ip 192.168.99.0 0.0.0.255 any
 permit ip any any
!
interface eth1
 description Link to Spine-1 eth2
 ip address 10.0.2.2 255.255.255.252
 ip access-group PERIMETER_SECURITY_POLICY in
 mtu 1500
 speed 1000
 duplex full
 no shutdown
!
interface eth2
 description Link to Spine-2 eth2
 ip address 10.0.4.2 255.255.255.252
 ip access-group PERIMETER_SECURITY_POLICY in
 mtu 1500
 speed 1000
 duplex full
 no shutdown
!
interface vlan20
 description Server LAN Subnet
 ip address 10.1.20.1 255.255.255.0
 no shutdown
!
router bgp 65002
 bgp router-id 10.1.20.1
 network 10.1.20.0 mask 255.255.255.0
 neighbor 10.0.2.1 remote-as 65000
 neighbor 10.0.2.1 description Spine-1
 neighbor 10.0.2.1 activate
 neighbor 10.0.4.1 remote-as 65000
 neighbor 10.0.4.1 description Spine-2
 neighbor 10.0.4.1 activate
!
end
