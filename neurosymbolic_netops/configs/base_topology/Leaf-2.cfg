! Leaf-2 - canonical Cisco IOS (rendered from IR; parse/render round-trip tested)
hostname Leaf-2
!
ip routing
!
ip access-list extended PERIMETER_SECURITY_POLICY
 deny ip 192.168.99.0 0.0.0.255 any
 permit ip any any
!
interface GigabitEthernet0/1
 description Link to Spine-1 Gi0/2
 ip address 10.0.2.2 255.255.255.252
 ip access-group PERIMETER_SECURITY_POLICY in
 mtu 1500
 speed 1000
 duplex full
 no shutdown
!
interface GigabitEthernet0/2
 description Link to Spine-2 Gi0/2
 ip address 10.0.4.2 255.255.255.252
 ip access-group PERIMETER_SECURITY_POLICY in
 mtu 1500
 speed 1000
 duplex full
 no shutdown
!
interface GigabitEthernet0/20
 description Server LAN (routed host-facing port)
 ip address 10.1.20.1 255.255.255.0
 mtu 1500
 no shutdown
!
router bgp 65002
 bgp router-id 10.1.20.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.0.2.1 remote-as 65000
 neighbor 10.0.2.1 description Spine-1
 neighbor 10.0.4.1 remote-as 65000
 neighbor 10.0.4.1 description Spine-2
 !
 address-family ipv4 unicast
  network 10.1.20.0 mask 255.255.255.0
  maximum-paths 2
  neighbor 10.0.2.1 activate
  neighbor 10.0.4.1 activate
 exit-address-family
!
end
