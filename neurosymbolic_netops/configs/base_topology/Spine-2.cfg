! Spine-2 Configuration
hostname Spine-2
!
ip routing
!
interface eth1
 description Link to Leaf-1 eth2
 ip address 10.0.3.1 255.255.255.252
 mtu 1500
 speed 1000
 duplex full
 no shutdown
!
interface eth2
 description Link to Leaf-2 eth2
 ip address 10.0.4.1 255.255.255.252
 mtu 1500
 speed 1000
 duplex full
 no shutdown
!
router bgp 65000
 bgp router-id 10.0.3.1
 neighbor 10.0.3.2 remote-as 65001
 neighbor 10.0.3.2 description Leaf-1
 neighbor 10.0.3.2 activate
 neighbor 10.0.4.2 remote-as 65002
 neighbor 10.0.4.2 description Leaf-2
 neighbor 10.0.4.2 activate
!
end
